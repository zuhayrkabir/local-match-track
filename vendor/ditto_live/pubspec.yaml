name: ditto_live
description: 'The Ditto Flutter SDK is an edge sync platform allowing devices to synchronize data with or without an internet connection. For more info, go to https://ditto.com/link/docs'
version: 5.1.0
homepage: 'https://www.ditto.com'

environment:
  sdk: '>=3.5.4 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  logger: ^2.0.2+1
  equatable: ^2.0.5
  cbor: ^6.2.0
  json_annotation: ^4.9.0
  convert: ^3.1.1
  meta: ^1.11.0
  path_provider: ^2.0.0
  path: ^1.9.0

dev_dependencies:
  ffigen: ^9.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.3.0
  very_good_analysis: ^5.0.0
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      android:
        package: live.ditto.flutter
        pluginClass: DittoPlugin
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true

  assets:
    - lib/assets/
    - lib/assets/ditto.wasm.snippets/
    - lib/assets/ditto.wasm.snippets/napi-dispatcher-wasm-2f83e9bddb5a9c18/
    - lib/assets/ditto.wasm.snippets/safer-ffi-a11ec19b6b02a0db/

# Sets which platforms appear as "supported" on pub.dev
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

ffigen:
  name: DittoBindings
  description: |
    Bindings for `src/dittoffi.h`.
  output: 'lib/src/bridge/native/ffi/generated_bindings.dart'
  headers:
    entry-points:
      - 'src/dittoffi.h'
  preamble: |
    // ignore_for_file: always_specify_types
    // ignore_for_file: camel_case_types
    // ignore_for_file: non_constant_identifier_names
    // ignore_for_file: unused_field
    // ignore_for_file: unused_element
  comments:
    style: any
    length: full
  functions:
    symbol-address:
      include:
        # we want to expose the symbols for any function that frees a resource,
        # since NativeFinalizer requires the symbol
        - '.*free.*'
