// group = "com.example.untitled"
// version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.7.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:7.3.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

if (file("gradle/localDev.gradle").exists()) {
    apply from: 'gradle/localDev.gradle'
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "live.ditto.flutter"
    compileSdk = 37

    defaultConfig {
        minSdk = 23
        targetSdk = 37
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")

    def dittoAndroidVersion = findProperty('dittoKotlinVersion') ?: project.version

    implementation "com.ditto:ditto-cinterop:${dittoAndroidVersion}"
    implementation "com.ditto:rustls:${dittoAndroidVersion}"
    implementation "com.ditto:transports:${dittoAndroidVersion}"
    implementation "com.ditto:util:${dittoAndroidVersion}"

    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
