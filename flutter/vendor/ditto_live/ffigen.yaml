# Run with `flutter pub run ffigen --config ffigen.yaml`.
name: DittoBindings
description: |
  Bindings for `src/dittoffi.h`.

  Regenerate bindings with `flutter pub run ffigen --config ffigen.yaml`.
output: 'lib/src/bridge/native/ffi/generated_bindings.dart'
headers:
  entry-points:
    - 'src/dittoffi.h'
  include-directives:
    - '**dittoffi.h'
macros:
  include:
    - '^DITTOFFI_.*'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: unused_field
  // ignore_for_file: unused_element
comments:
  style: any
  length: full

functions:
  leaf:
    include:
      - 'ditto_c_string_free'
  symbol-address:
    include:
      - '.*free.*' # we want to expose the symbols for any function that frees a resource, since NativeFinalizer requires the symbol
